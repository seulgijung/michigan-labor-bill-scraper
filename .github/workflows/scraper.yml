# GitHub Actions workflow: run the Michigan labor-bill update scraper on a schedule

name: Update Bill Scraper

on:
  schedule:
    # Runs at 08:00 UTC on Mondays and Thursdays (twice a week)
    - cron: "0 8 * * 1,4"
  workflow_dispatch:   # allows manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository (so we have the code + existing data.json)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the update scraper (API key comes from repository Secrets)
      - name: Run scraper
        env:
          SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
        run: python scraper.py

      # 5. Commit and push any changed data/logs back to the repo
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json change_log.json error_log.json
          git commit -m "Update bill data ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes to commit"
          git push
